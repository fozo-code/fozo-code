<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#2a2f4d"/></pattern></defs>
<style>
.m{font-family:'Courier New',monospace;font-weight:700}
.t{opacity:0;animation:cyc 9s infinite}
.t2{animation-delay:3s}.t3{animation-delay:6s}
@keyframes cyc{0%{opacity:0}5%{opacity:1}30%{opacity:1}35%{opacity:0}100%{opacity:0}}
.f1{animation:fl 6s ease-in-out infinite}.f2{animation:fl 8s ease-in-out infinite reverse}
@keyframes fl{50%{transform:translateY(-14px)}}
.sp{animation:sp 20s linear infinite;transform-origin:700px 190px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
<rect width="900" height="260" rx="20" fill="#0f1220"/>
<rect width="900" height="260" rx="20" fill="url(#g)"/>
<g class="f1"><circle cx="740" cy="90" r="64" fill="none" stroke="#8b7dff" stroke-width="4"/><circle cx="740" cy="90" r="34" fill="#8b7dff" opacity=".18"/></g>
<g class="f2"><circle cx="820" cy="180" r="30" fill="#22d3ee"/><circle cx="820" cy="180" r="12" fill="#0f1220"/></g>
<rect class="sp" x="670" y="160" width="60" height="60" rx="8" fill="none" stroke="#22d3ee" stroke-width="4"/>
<polygon points="600,70 630,120 570,120" fill="none" stroke="#8b7dff" stroke-width="3" class="f2"/>
<path d="M560 200h24M572 188v24" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
<path d="M850 40h20M860 30v20" stroke="#8b7dff" stroke-width="4" stroke-linecap="round"/>

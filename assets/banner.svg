<text x="56" y="165" class="m" font-size="92" fill="#ffffff" letter-spacing="4">FOZO</text>
<g class="m" font-size="24" fill="#22d3ee">
<text x="60" y="208" class="t">AI Developer</text>
<text x="60" y="208" class="t t2">Web Creator</text>
<text x="60" y="208" class="t t3">Prompt Engineer</text>
</g>
